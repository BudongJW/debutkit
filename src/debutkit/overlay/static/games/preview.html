<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>debutkit 게임 패키지 미리보기</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
    #stage > * { position: absolute; }
    .scene { inset: 0; width: 1920px; height: 1080px; }
    .layer { border: 0; background: transparent; color-scheme: normal; }
    .cam { overflow: hidden; }
    .cam img { position: absolute; left: 6%; right: 6%; bottom: 0; width: 88%; height: 92%; object-fit: contain; object-position: 50% 100%; }
    .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    /* 게임 화면 느낌의 HUD(어둡고 옅게): 오버레이가 피한 자리를 보여 준다 */
    .hud { box-sizing: border-box; border-radius: 6px; background: rgba(8, 10, 14, 0.38); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
    .hud.map { background: radial-gradient(circle at 60% 40%, rgba(255, 255, 255, 0.22) 0 3%, transparent 3.5%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 24px),
      rgba(8, 10, 14, 0.5); }
    .hud.bar::before, .hud.bar::after { content: ""; position: absolute; left: 6%; height: 12%; border-radius: 3px; }
    .hud.bar::before { right: 30%; top: 26%; background: linear-gradient(90deg, rgba(120, 230, 140, 0.85), rgba(120, 230, 140, 0.55)); }
    .hud.bar::after { right: 46%; top: 50%; background: rgba(110, 180, 255, 0.75); }
    .hud.feed { background: repeating-linear-gradient(180deg, rgba(8, 10, 14, 0.42) 0 30px, transparent 30px 40px); box-shadow: none; }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <script src="/games/preview.js"></script>
</body>
</html>
