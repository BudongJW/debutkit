<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <!-- debutkit 예시 캐릭터(게임 패키지 미리보기의 캐릭터 자리): 고양이 귀 헤드셋을 쓴 방송인. debutkit에서 그린 그림 -->
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4a6b"/><stop offset="1" stop-color="#3b2f4a"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0dc"/><stop offset="1" stop-color="#f4a3b8"/></linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff8fa8" stop-opacity="0.55"/><stop offset="1" stop-color="#ff8fa8" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 몸(후드) -->
  <path d="M90 700 C100 560 180 500 300 500 C420 500 500 560 510 700 Z" fill="url(#hood)"/>
  <path d="M235 505 L300 590 L365 505" fill="none" stroke="#e48aa2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="262" cy="620" r="9" fill="#fff"/><circle cx="338" cy="620" r="9" fill="#fff"/>
  <!-- 목 -->
  <rect x="268" y="430" width="64" height="90" rx="26" fill="#f6d3c2"/>
  <!-- 뒷머리 -->
  <path d="M130 300 C120 150 210 80 300 80 C390 80 480 150 470 300 L480 470 C440 500 400 480 390 450 L210 450 C200 480 160 500 120 470 Z" fill="url(#hair)"/>
  <!-- 얼굴 -->
  <ellipse cx="300" cy="300" rx="150" ry="160" fill="#fbe1d3"/>
  <ellipse cx="225" cy="345" rx="34" ry="20" fill="url(#cheek)"/><ellipse cx="375" cy="345" rx="34" ry="20" fill="url(#cheek)"/>
  <!-- 눈 -->
  <g fill="#2b2238">
    <ellipse cx="240" cy="300" rx="22" ry="30"/><ellipse cx="360" cy="300" rx="22" ry="30"/>
  </g>
  <g fill="#ffffff"><circle cx="247" cy="288" r="8"/><circle cx="367" cy="288" r="8"/><circle cx="233" cy="312" r="4"/><circle cx="353" cy="312" r="4"/></g>
  <path d="M283 360 Q300 374 317 360" fill="none" stroke="#c05a6e" stroke-width="7" stroke-linecap="round"/>
  <!-- 앞머리 -->
  <path d="M150 260 C160 160 230 120 300 120 C370 120 440 160 450 260 C420 210 390 200 370 230 C350 190 320 185 300 230 C280 185 250 190 230 230 C210 200 180 210 150 260 Z" fill="url(#hair)"/>
  <!-- 고양이 귀 헤드셋 -->
  <path d="M140 250 C140 120 220 60 300 60 C380 60 460 120 460 250" fill="none" stroke="#ff4f8b" stroke-width="22" stroke-linecap="round"/>
  <path d="M175 120 L150 30 L245 82 Z" fill="#ff4f8b"/><path d="M182 104 L168 56 L222 86 Z" fill="#ffd0dc"/>
  <path d="M425 120 L450 30 L355 82 Z" fill="#ff4f8b"/><path d="M418 104 L432 56 L378 86 Z" fill="#ffd0dc"/>
  <rect x="116" y="236" width="52" height="96" rx="24" fill="#2b2238"/><rect x="432" y="236" width="52" height="96" rx="24" fill="#2b2238"/>
  <rect x="124" y="248" width="36" height="72" rx="16" fill="#ff4f8b"/><rect x="440" y="248" width="36" height="72" rx="16" fill="#ff4f8b"/>
  <!-- 마이크 -->
  <path d="M150 320 C160 390 200 410 250 404" fill="none" stroke="#2b2238" stroke-width="9" stroke-linecap="round"/>
  <rect x="244" y="392" width="34" height="24" rx="12" fill="#2b2238"/>
</svg>
