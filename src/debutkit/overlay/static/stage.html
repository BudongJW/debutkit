<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>debutkit 방송 화면 미리보기</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css?fonts=0">
  <link rel="stylesheet" href="/ui.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 17px; margin: 0; }
    main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 18px 24px 40px; align-items: start; }
    aside { display: grid; gap: 14px; }
    section { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
    label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 2px 0; }
    label.check small { margin-left: auto; color: var(--dim); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    select, input[type=number], input[type=text] { padding: 5px 7px; border: 1px solid #c9c3bd; border-radius: 3px; font: inherit; font-size: 14px; background: #fff; min-width: 0; }
    input[type=number] { width: 96px; }
    input[type=text] { flex: 1; }
    button { background: var(--text); color: #fff; border: 1px solid var(--text); border-radius: 3px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #fff; color: var(--text); border-color: #c9c3bd; }
    button:hover { opacity: 0.88; }
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .swatches button { height: 34px; padding: 0; border-radius: 4px; border: 2px solid transparent; position: relative; background: var(--sw); overflow: hidden; }
    .swatches button::after { content: ""; position: absolute; right: 0; bottom: 0; width: 40%; height: 40%; background: var(--hl); border-top-left-radius: 4px; }
    .swatches button[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px #fff inset; }
    .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .colors label { display: grid; gap: 2px; font-size: 13px; color: var(--dim); }
    .colors input[type=color] { width: 100%; height: 32px; padding: 0 2px; border: 1px solid #c9c3bd; border-radius: 3px; background: #fff; }
    .viewer { position: sticky; top: 12px; }
    .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: #222; box-shadow: 0 0 0 1px var(--line); }
    .canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .canvas iframe { position: absolute; border: 0; background: transparent; color-scheme: normal; }
    .bg { position: absolute; inset: 0; }
    .bg.game { background:
      radial-gradient(ellipse 260px 90px at 1150px 860px, rgba(0,0,0,.18), transparent 70%),
      radial-gradient(circle at 1150px 700px, #c7743a 0 120px, transparent 121px),
      radial-gradient(circle at 420px 260px, #fff8 0 60px, transparent 61px),
      linear-gradient(180deg, #6fb7e8 0%, #a9d8f2 52%, #79b86c 52%, #4f8c4f 100%); }
    .bg.dark { background: linear-gradient(135deg, #20262b, #39424a); }
    .bg.light { background: linear-gradient(135deg, #f2eee9, #dcd6cf); }
    .bg.check { background: repeating-conic-gradient(#30373c 0% 25%, #2a3035 0% 50%) 0 0 / 40px 40px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--dim); }
    .legend b { color: var(--text); }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .viewer { position: static; } }
  </style>
</head>
<body>
  <header><img src="/favicon.svg" alt=""><h1>방송 화면 미리보기</h1></header>
  <main>
    <aside>
      <section>
        <h2>방송 화면에 놓을 것</h2>
        <div id="layers"></div>
        <p class="hint">OBS 장면 만들기와 같은 자리입니다. 후원 벽, 뽑기판, 레이스는 장면에 숨긴 채로 들어 있어 쓸 때 OBS에서 켭니다.</p>
      </section>
      <section>
        <h2>시험 후원, 채팅</h2>
        <div class="row">
          <select id="unit" aria-label="후원 단위"></select>
          <input id="amount" type="number" min="1" aria-label="금액이나 개수">
        </div>
        <div class="row">
          <input id="donor" type="text" value="시험 시청자" aria-label="이름">
          <button id="send-donation">시험 후원</button>
        </div>
        <div class="row">
          <input id="chat" type="text" value="!참가" aria-label="채팅 내용">
          <button class="secondary" id="send-chat">시험 채팅</button>
          <button class="secondary" id="send-member">구독</button>
        </div>
        <p class="hint">후원 하나가 알림, 후원 추첨, 후원 벽, 뽑기판, 참여 추첨에 함께 어떻게 나오는지 확인합니다. 시험 사건은 방송 플랫폼으로 보내지 않습니다.</p>
      </section>
      <section>
        <h2>방송 색</h2>
        <div class="swatches" id="swatches"></div>
        <div class="colors">
          <label>주 색<input type="color" id="primary"></label>
          <label>강조 색(희귀, 금박)<input type="color" id="highlight"></label>
        </div>
        <div class="row">
          <button class="primary" id="save-theme">색 적용</button>
          <button class="secondary" id="from-logo">로고 색 가져오기</button>
        </div>
        <p class="hint">채팅, 알림, 추첨, 뽑기판, 후원 벽, 레이스와 조작 화면이 같은 색을 씁니다. 화면마다 따로 고른 색이 있으면 그 색이 우선합니다.</p>
      </section>
      <section>
        <h2>배경</h2>
        <div class="row">
          <select id="background" aria-label="미리보기 배경">
            <option value="game">게임 화면 흉내</option>
            <option value="dark">어두운 화면</option>
            <option value="light">밝은 화면</option>
            <option value="check">투명(체크무늬)</option>
          </select>
          <button class="secondary" id="reload">화면 새로고침</button>
        </div>
      </section>
    </aside>
    <div class="viewer">
      <div class="screen" id="screen"><div class="canvas" id="canvas"><div class="bg game" id="bg"></div></div></div>
      <div class="legend" id="legend"></div>
    </div>
  </main>
  <script src="/theme.js"></script>
  <script src="/ui.js"></script>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    // 아래에서 위 순서(OBS 장면과 같음). [id, 이름, 주소, 자리(왼쪽, 위, 가로, 세로), 처음에 켬]
    // 후원 벽은 벽지처럼 캐릭터 뒤, 목표 게이지와 순위는 왼쪽 위(알림이 뜨는 가운데 위와 겹치지 않게)
    const LAYERS = [
      ["wall", "후원 벽", "/wall", null, false],
      ["character", "캐릭터", "/character", [0, 410, 614, 670], true],
      ["pick", "뽑기판", "/pick", null, false],
      ["race", "참여 레이스", "/race", null, false],
      ["goal", "목표 게이지", "/wall/goal", [33, 24, 576, 108], false],
      ["rank", "후원 순위", "/wall/rank", [33, 151, 288, 389], false],
      ["chat", "채팅", "/chat", [1466, 32, 422, 1016], true],
      ["alerts", "후원 알림", "/alerts", null, true],
      ["draw", "후원 추첨", "/draw", null, true],
    ];
    const STORE = "debutkit-stage";
    const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (error) { return {}; } })();
    const state = { layers: saved.layers || Object.fromEntries(LAYERS.map(([id, , , , on]) => [id, on])), background: saved.background || "game" };
    const store = () => localStorage.setItem(STORE, JSON.stringify(state));
    const canvas = $("canvas");
    const frames = {};

    function frame(id) {
      const [, label, src, rect] = LAYERS.find((layer) => layer[0] === id);
      const [x, y, w, h] = rect || [0, 0, 1920, 1080];
      const node = document.createElement("iframe");
      node.title = label;
      node.src = src;
      node.allow = "autoplay";
      Object.assign(node.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
      return node;
    }

    function render() {
      for (const [id] of LAYERS) {
        const on = Boolean(state.layers[id]);
        if (on && !frames[id]) {
          frames[id] = frame(id);
          // 순서 유지: 뒤에 오는 켜진 층 앞에 넣는다
          const after = LAYERS.slice(LAYERS.findIndex((layer) => layer[0] === id) + 1).map(([other]) => frames[other]).find(Boolean);
          canvas.insertBefore(frames[id], after || null);
        } else if (!on && frames[id]) {
          frames[id].remove();
          delete frames[id];
        }
      }
      $("bg").className = `bg ${state.background}`;
      $("legend").replaceChildren(...LAYERS.filter(([id]) => state.layers[id]).map(([, label, src]) => {
        const item = document.createElement("span");
        const name = document.createElement("b");
        name.textContent = label;
        item.append(name, ` ${location.origin}${src}`);
        return item;
      }));
    }

    for (const [id, label, src] of LAYERS) {
      const row = document.createElement("label");
      row.className = "check";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = Boolean(state.layers[id]);
      box.addEventListener("change", () => { state.layers[id] = box.checked; store(); render(); });
      const path = document.createElement("small");
      path.textContent = src;
      row.append(box, label, path);
      $("layers").appendChild(row);
    }
    $("background").value = state.background;
    $("background").addEventListener("change", () => { state.background = $("background").value; store(); render(); });
    $("reload").addEventListener("click", () => { for (const node of Object.values(frames)) node.src = node.src; });

    function fit() {
      canvas.style.transform = `scale(${$("screen").clientWidth / 1920})`;
    }
    addEventListener("resize", fit);

    async function post(path, body) {
      const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "요청 실패");
      return data;
    }
    const report = (promise, done) => promise.then(() => debutkitUi.toast(done)).catch((error) => debutkitUi.toast(error.message, true));

    fetch("/stage/units").then((r) => r.json()).then((units) => {
      for (const [key, unit] of Object.entries(units)) {
        const option = new Option(unit.name, key);
        option.dataset.amount = unit.amount;
        $("unit").add(option);
      }
      $("amount").value = $("unit").selectedOptions[0].dataset.amount;
    });
    $("unit").addEventListener("change", () => { $("amount").value = $("unit").selectedOptions[0].dataset.amount; });
    $("send-donation").addEventListener("click", () => report(post("/stage/test", {
      kind: "donation", unit: $("unit").value, amount: Number($("amount").value), name: $("donor").value }), "시험 후원을 보냄"));
    $("send-chat").addEventListener("click", () => report(post("/stage/test", { kind: "chat", text: $("chat").value, name: $("donor").value }), "시험 채팅을 보냄"));
    $("send-member").addEventListener("click", () => report(post("/stage/test", { kind: "member", name: $("donor").value }), "시험 구독을 보냄"));

    // 방송 색
    let presets = {};
    function showTheme(theme) {
      $("primary").value = theme.primary;
      $("highlight").value = theme.highlight;
      for (const button of $("swatches").children) button.setAttribute("aria-pressed", String(button.dataset.preset === theme.preset));
      debutkitTheme.apply(theme);
      $("from-logo").disabled = !theme.logo;
      $("from-logo").title = theme.logo ? `로고 주 색 ${theme.logo.primary}` : "로고 만들기에서 저장한 로고가 없음";
    }
    async function saveTheme(body) {
      try {
        showTheme(await post("/theme", body));
        debutkitUi.toast("방송 색을 바꿈");
      } catch (error) {
        debutkitUi.toast(error.message, true);
      }
    }
    fetch("/theme").then((r) => r.json()).then((theme) => {
      presets = theme.presets;
      for (const [key, preset] of Object.entries(presets)) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.preset = key;
        button.title = preset.name;
        button.setAttribute("aria-label", preset.name);
        button.style.setProperty("--sw", preset.primary);
        button.style.setProperty("--hl", preset.highlight);
        button.addEventListener("click", () => saveTheme({ preset: key }));
        $("swatches").appendChild(button);
      }
      showTheme(theme);
    });
    $("save-theme").addEventListener("click", () => saveTheme({ primary: $("primary").value, highlight: $("highlight").value }));
    $("from-logo").addEventListener("click", () => saveTheme({ from_logo: true }));

    render();
    fit();
    requestAnimationFrame(fit);
  </script>
</body>
</html>
