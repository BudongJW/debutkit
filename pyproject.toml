[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debutkit"
version = "0.5.0"
description = "버튜버 데뷔 키트: 방송 준비 점검, OBS 장면 세트 자동 구성, CHZZK SOOP Twitch YouTube 통합 채팅 오버레이, 방송 중 자동 클립"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["vtuber", "obs-studio", "chzzk", "soop", "overlay", "streaming", "debut"]

[project.urls]
Homepage = "https://budongjw.github.io/debutkit/"
Documentation = "https://budongjw.github.io/debutkit/guide.html"
Repository = "https://github.com/BudongJW/debutkit"
Changelog = "https://github.com/BudongJW/debutkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 채팅 연결 모듈: 방송 플랫폼 채팅 수신, OBS 제어, 급증 판단, ffmpeg 내려받기
live = ["stream2clip @ git+https://github.com/BudongJW/stream2clip@v0.14.1", "websocket-client>=1.6"]
gui = ["debutkit[live]", "PySide6>=6.6"]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
debutkit = "debutkit.cli:main"

[project.gui-scripts]
debutkit-gui = "debutkit.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debutkit = ["overlay/static/*", "gui/icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
