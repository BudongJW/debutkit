[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debutkit"
version = "1.0.0rc16"
description = "버튜버 방송 준비용 오픈소스 소프트웨어. PC 점검, OBS 장면 구성, 치지직 SOOP Twitch YouTube 통합 채팅창과 후원 알림, 방송 중 자동 클립"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["vtuber", "obs-studio", "chzzk", "soop", "overlay", "streaming", "debut"]

[project.urls]
Homepage = "https://budongjw.github.io/debutkit/"
Documentation = "https://budongjw.github.io/debutkit/guide.html"
Repository = "https://github.com/BudongJW/debutkit"
Changelog = "https://github.com/BudongJW/debutkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 채팅 연결 모듈: 방송 플랫폼 채팅 수신, OBS 제어, 급증 판단, ffmpeg 내려받기
live = ["stream2clip @ git+https://github.com/BudongJW/stream2clip@v0.14.1", "websocket-client>=1.6"]
# YouTube 채팅 스트리밍(streamList, gRPC). 없으면 요청 방식 사용
youtube = ["grpcio>=1.60", "protobuf>=4.25"]
gui = ["debutkit[live,youtube]", "PySide6>=6.6"]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
debutkit = "debutkit.cli:main"

[project.gui-scripts]
debutkit-gui = "debutkit.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debutkit = ["overlay/static/*", "overlay/static/**/*", "gui/icon.png", "vendor/README.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["src/debutkit/vendor"]  # 함께 배포하는 외부 코드(수정하지 않음)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
