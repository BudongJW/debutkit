name: 기능 제안
description: 새 기능, 개선 요청
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: 필요한 상황
      description: 기능이 필요한 방송 준비 또는 방송 중 상황
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 대안
      description: 현재 사용하는 다른 프로그램이나 방법
