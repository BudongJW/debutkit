name: Release

# v* 태그를 올리면 운영체제별 배포 파일을 만들어 GitHub 릴리스에 첨부한다.
# - Windows: 설치 프로그램(setup.exe), 압축 파일(zip). 무인 설치, 실행, 제거, 설치 중 ffmpeg 다운로드까지 검증
# - macOS: debutkit.app(zip), Linux: debutkit 폴더(tar.gz). 파이썬 없이 실행 검증
# - 휴대폰 앱(안드로이드 APK, mobile/android): 단위 테스트 후 빌드. 서명 키 비밀값(ANDROID_KEYSTORE_BASE64 등)이 없으면 시험용 디버그 키
# - macOS 서명: 강화된 런타임으로 서명 후 실행 검증. Developer ID 비밀값이 있으면 그 인증서로 서명하고 공증
# - 코드 서명: 저장소 비밀값 WINDOWS_SIGNING_PFX_BASE64, WINDOWS_SIGNING_PASSWORD가 있을 때만(docs/RELEASING.md)
# 직접 실행(workflow_dispatch)하면 릴리스 없이 빌드 결과만 artifact로 남긴다. 인증서 비밀값이 없으면
# 임시 자체 서명 인증서로 서명 절차(실행 파일, 설치 프로그램, 제거 프로그램, 타임스탬프)를 시험한다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.state.outputs.signed }}
    env:
      PYTHONIOENCODING: utf-8
      # SignPath(오픈소스 무료 서명): 저장소 변수 SIGNPATH_ORGANIZATION_ID가 있고 태그 릴리스일 때만. 요청마다 승인자가 직접 승인
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[gui,build]"
      - name: Version
        id: meta
        shell: bash
        run: echo "version=$(python -c 'from debutkit import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Signing certificate (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          if ($env:SIGNPATH -eq "true") {
            Write-Host "SignPath 서명 사용(실행 파일, 설치 프로그램)"
          } elseif ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            "DEBUTKIT_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
            "DEBUTKIT_SIGN_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV
            Write-Host "코드 서명 사용"
          } elseif ($env:EVENT -eq "workflow_dispatch") {
            # 직접 실행(릴리스 없음): 임시 자체 서명 인증서로 서명 절차 전체를 시험. 태그 릴리스에는 쓰지 않음
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=debutkit signing test" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
            $password = [guid]::NewGuid().ToString("N")
            Write-Host "::add-mask::$password"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            "DEBUTKIT_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
            "DEBUTKIT_SIGN_PASSWORD=$password" >> $env:GITHUB_ENV
            "DEBUTKIT_SIGN_TEST=1" >> $env:GITHUB_ENV
            Write-Host "서명 시험: 임시 자체 서명 인증서 사용(배포하지 않음)"
          } else {
            Write-Host "서명 인증서 없음: 서명 없이 빌드"
          }
      - name: Build (version information check)
        run: python packaging/build_windows.py --stage build
      - name: Upload programs for SignPath
        if: env.SIGNPATH == 'true'
        id: upload-programs
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-programs
          path: |
            dist/debutkit/debutkit.exe
            dist/debutkit/debutkit-gui.exe
          if-no-files-found: error
      - name: Sign programs (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'debutkit' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-programs
          parameters: |
            version: "${{ steps.meta.outputs.version }}"
      - name: Use signed programs
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: Copy-Item dist\signed-programs\*.exe dist\debutkit\ -Force
      - name: Sign (certificate file), smoke test, archive
        run: python packaging/build_windows.py --stage package
      - name: Installer build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          python packaging/build_windows.py --installer-only
      - name: Upload installer for SignPath
        if: env.SIGNPATH == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Sign installer (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'debutkit' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-installer
          parameters: |
            version: "${{ steps.meta.outputs.version }}"
      - name: Use signed installer
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: Copy-Item dist\signed-installer\*-setup.exe dist\ -Force
      - name: Installer test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem "dist\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "설치 프로그램 없음" }
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB)) MB"

          # 1. 무인 설치(ffmpeg 작업은 기본 꺼짐), 설치한 프로그램 실행, 제거
          $target = "$env:RUNNER_TEMP\debutkit-installed"
          $run = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 30; throw "설치 실패 ($($run.ExitCode))" }
          foreach ($file in "debutkit-gui.exe", "debutkit.exe", "unins000.exe") {
            if (-not (Test-Path "$target\$file")) { throw "설치 후 $file 없음" }
          }
          if ($env:DEBUTKIT_SIGN_PFX -or $env:SIGNPATH -eq "true") {  # 서명 확인: 실행 파일 2개, 설치 프로그램, 설치된 실행 파일, 제거 프로그램(인증서 파일 방식만)
            $files = @("dist\debutkit\debutkit.exe", "dist\debutkit\debutkit-gui.exe", $setup.FullName, "$target\debutkit.exe")
            if ($env:DEBUTKIT_SIGN_PFX) { $files += "$target\unins000.exe" }
            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file
              if (-not $signature.SignerCertificate) { throw "서명 없음: $file" }
              if (-not $signature.TimeStamperCertificate) { throw "타임스탬프 없음: $file" }
              Write-Host "서명: $(Split-Path $file -Leaf), $($signature.SignerCertificate.Subject), 상태 $($signature.Status), 타임스탬프 $($signature.TimeStamperCertificate.Subject)"
            }
          }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\debutkit.lnk"
          if (-not (Test-Path $menu)) { throw "시작 메뉴 바로 가기 없음" }
          $version = (& "$target\debutkit.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "설치한 debutkit.exe 실행 실패" }
          Write-Host "installed: $version"
          $remove = Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "제거 실패 ($($remove.ExitCode))" }
          Start-Sleep -Seconds 2
          if (Test-Path "$target\debutkit.exe") { throw "제거 후 프로그램이 남음" }
          if (Test-Path $menu) { throw "제거 후 시작 메뉴 바로 가기가 남음" }
          Write-Host "무인 설치, 실행, 제거 확인"

          # 2. ffmpeg 다운로드 작업: ffmpeg가 없는 PC 기준(PATH 최소화). 고정 빌드를 실제로 다운로드
          $tools = "$env:USERPROFILE\.cache\stream2clip\tools"
          if (Test-Path "$tools\ffmpeg.exe") { throw "실행 환경에 이미 다운로드한 ffmpeg가 있음" }
          $target = "$env:RUNNER_TEMP\debutkit-ffmpeg"
          $savedPath = $env:PATH
          foreach ($attempt in 1..2) {
            $env:PATH = "C:\Windows\System32;C:\Windows"
            $run = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/TASKS=ffmpeg", "/LOG=$env:RUNNER_TEMP\setup-ffmpeg.log" -Wait -PassThru
            $env:PATH = $savedPath
            if ($run.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-ffmpeg.log" -Tail 30; throw "ffmpeg 작업 설치 실패 ($($run.ExitCode))" }
            if (Test-Path "$tools\ffmpeg.exe") { break }
            Select-String -Path "$env:RUNNER_TEMP\setup-ffmpeg.log" -Pattern "ffmpeg", "Download" | Select-Object -Last 10 | ForEach-Object { Write-Host $_.Line }
            if ($attempt -eq 2) { throw "설치 프로그램이 ffmpeg를 다운로드하지 않음" }
            Start-Sleep -Seconds 20
          }
          foreach ($file in "ffmpeg.exe", "ffprobe.exe") {
            if (-not (Test-Path "$tools\$file")) { throw "$file 없음: $tools" }
          }
          $report = & "$target\debutkit.exe" setup | Out-String
          Write-Host $report
          if ($LASTEXITCODE -ne 0 -or $report -notmatch [regex]::Escape("$tools\ffmpeg.exe")) { throw "설치한 프로그램이 다운로드한 ffmpeg를 사용하지 않음" }
          $remove = Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "제거 실패 ($($remove.ExitCode))" }
          if (-not (Test-Path "$tools\ffmpeg.exe")) { throw "제거 시 같이 쓰는 ffmpeg 폴더까지 삭제됨" }
          Remove-Item $tools -Recurse -Force
          Write-Host "설치 중 ffmpeg 다운로드, 사용, 제거 후 보존 확인"
      - name: Signing state
        id: state
        shell: pwsh
        run: |
          # 릴리스 노트용: 실제 인증서(SignPath 또는 인증서 파일)로 서명했는지. 서명 시험용 자체 서명은 제외
          $signed = ($env:SIGNPATH -eq "true") -or ($env:DEBUTKIT_SIGN_PFX -and -not $env:DEBUTKIT_SIGN_TEST)
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Windows 서명: $signed"
      - uses: actions/upload-artifact@v7
        with:
          name: debutkit-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest  # Apple Silicon(arm64)
    timeout-minutes: 40
    outputs:
      notarized: ${{ steps.build.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[gui,build]" pillow
      - name: Signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "Developer ID 인증서 없음: 임시 서명(ad-hoc)으로 강화된 런타임 시험"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "DEBUTKIT_MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Developer ID 서명 사용"
      - name: Build, sign, smoke test, notarize
        id: build
        env:
          DEBUTKIT_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          DEBUTKIT_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUTKIT_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/build_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: debutkit-macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libxcb-cursor0
      - name: Install
        run: python -m pip install -e ".[gui,build]"
      - name: Build and smoke test
        run: python packaging/build_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: debutkit-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing key (optional)
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debutkit-release.jks"
            echo "DEBUTKIT_ANDROID_KEYSTORE=$RUNNER_TEMP/debutkit-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 비밀값 없음: 시험용 디버그 키로 서명(업데이트 시 이전 앱 삭제 필요, docs/RELEASING.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests and APK
        working-directory: mobile/android
        env:
          DEBUTKIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEBUTKIT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEBUTKIT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Name the APK
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/debutkit-phone-$version-android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: debutkit-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: debutkit-*  # 배포 파일만(서명 전 파일 artifact 제외)
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.windows.outputs.signed == 'true' && '--windows-signed' || '' }}
          NOTARIZED: ${{ needs.macos.outputs.notarized == 'true' && '--macos-notarized' || '' }}
          ANDROID_SIGNED: ${{ needs.android.outputs.signed == 'true' && '--android-signed' || '' }}
        run: |
          ls -la dist
          python packaging/release_notes.py "$GITHUB_REF_NAME" $SIGNED $NOTARIZED --android $ANDROID_SIGNED > notes.md  # CHANGELOG.md의 해당 버전 항목, 실제 서명 상태
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ [0-9](a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi  # 1.0.0rc1 등: 최신 릴리스로 표시하지 않음
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "debutkit $GITHUB_REF_NAME" --notes-file notes.md $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/*-setup.exe dist/*.apk --clobber
