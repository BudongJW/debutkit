name: Verify

# 실제 OBS, 실제 YouTube 서버로 debutkit을 검증한다(가짜 구현 없음).
# - obs: Windows, macOS, Linux 각각 장면 생성(운영체제별 소스 종류), 고급 출력 모드의 리플레이 버퍼 설정, OBS 재시작 후 자동 클립 저장까지
# - youtube: 스트리밍 메서드 경로와 API 키 전달 방식. 비밀값 YOUTUBE_API_KEY가 있으면 실제 채팅 수신까지
# 릴리스 작업 브랜치에 push하거나 직접 실행할 때, 그리고 v* 태그에서 실행한다.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obs:
    name: obs-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, display: ":99" }
          - { name: windows, os: windows-latest, display: "" }
          - { name: macos, os: macos-latest, display: "" }
    env:
      DEBUTKIT_VERIFY_OBS: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONIOENCODING: utf-8
      DISPLAY: ${{ matrix.display }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: OBS, Xvfb, ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb ffmpeg
          Xvfb :99 -screen 0 1920x1080x24 +extension Composite > /dev/null 2>&1 &
      - name: OBS (Windows)
        if: runner.os == 'Windows'
        run: choco install obs-studio -y --no-progress
      - name: OBS, ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask obs
          brew install ffmpeg
          xattr -dr com.apple.quarantine /Applications/OBS.app || true
      - name: Install
        run: python -m pip install -e ".[live]"
      - name: ffmpeg download (Windows, debutkit setup)
        if: runner.os == 'Windows'
        run: python -m debutkit setup --ffmpeg
      - name: OBS settings
        run: python packaging/verify_obs.py configure
      - name: Start OBS
        run: python packaging/verify_obs.py start 1
      - name: Scenes and replay buffer setting (advanced output)
        run: python packaging/verify_obs.py scenes
      - name: Restart OBS (the replay buffer setting takes effect after a restart)
        run: |
          python packaging/verify_obs.py stop
          python packaging/verify_obs.py start 2
      - name: Auto clip end to end
        timeout-minutes: 6
        run: python packaging/verify_obs.py clip
      - name: OBS logs
        if: always()
        run: python packaging/verify_obs.py logs || true

  devices-linux:
    # 커널 가상 장치(snd-aloop 마이크, v4l2loopback 카메라)로 Linux 마이크, 웹캠 감지 확인. arecord가 있을 때와 없을 때(/proc/asound) 모두
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Virtual microphone and camera
        run: |
          sudo apt-get update
          sudo apt-get install -y alsa-utils v4l2loopback-dkms "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)"
          sudo modprobe snd-aloop
          sudo modprobe v4l2loopback card_label="debutkit test camera" exclusive_caps=1
          arecord -l
          cat /proc/asound/pcm
          cat /sys/class/video4linux/*/name
      - name: Install
        run: python -m pip install -e .
      - name: Detection (arecord)
        run: python packaging/check_platform.py --expect mic=Loopback --expect camera="debutkit test camera"
      - name: Detection without arecord (/proc/asound)
        run: |
          sudo mv /usr/bin/arecord /usr/bin/arecord.off
          python packaging/check_platform.py --expect mic=Loopback --expect camera="debutkit test camera"

  youtube:
    # API 키 없이: 실제 서버의 스트리밍 메서드 경로, 키 전달 방식, 오류 안내 확인
    # 저장소 비밀값 YOUTUBE_API_KEY가 있으면: 방송 중인 YouTube 채팅으로 요청 방식과 스트리밍 방식 실제 수신 확인
    # (방송 주소는 저장소 변수 YOUTUBE_TEST_URL, 없으면 24시간 라이브 방송 1개)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      HAS_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[youtube]"
      - name: Endpoint (no API key)
        run: python packaging/verify_youtube.py endpoint
      - name: Live chat with API key
        if: env.HAS_KEY == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python packaging/verify_youtube.py check "${{ vars.YOUTUBE_TEST_URL || 'https://www.youtube.com/watch?v=jfKfPfyJRdk' }}"
      - name: Live chat with API key (skipped)
        if: env.HAS_KEY != 'true'
        run: echo "저장소 비밀값 YOUTUBE_API_KEY가 없어 실제 채팅 수신 확인 생략(docs/RELEASING.md)"
